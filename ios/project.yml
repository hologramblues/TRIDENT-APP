# Spec XcodeGen — générer le projet avec : cd ios && xcodegen
# Le .xcodeproj généré n'est PAS versionné (voir .gitignore), ce fichier est la source de vérité.
name: Trident
options:
  bundleIdPrefix: com.jeremiegalan
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  Trident:
    type: application
    platform: iOS
    sources: [Trident]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeremiegalan.trident
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1" # iPhone uniquement
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: FJCD5D8B6W # équipe personnelle (identifiant public, pas un secret) — survit aux régénérations xcodegen
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Trident/Info.plist # généré par xcodegen, non versionné
      properties:
        # Camouflage scénique : l'app s'affiche "Notes" sur l'écran d'accueil
        CFBundleDisplayName: Notes
        UILaunchScreen: {} # écran de lancement vide → pas de flash blanc
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Automatic # requis pour le clair/sombre auto du mode Notes
        NSMicrophoneUsageDescription: "Le micro permet de dicter du texte."
        NSSpeechRecognitionUsageDescription: "La reconnaissance vocale transcrit le texte dicté."
        NSBluetoothAlwaysUsageDescription: "Connexion à un afficheur externe."
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.jeremiegalan.trident
            CFBundleURLSchemes: [trident]
